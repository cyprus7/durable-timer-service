rule_files:
  - ../docs/prometheus-alert-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'timer_service_deliveries_total{result="dead_letter",reason="callback_failed"}'
        values: '0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: DurableTimerDeadLetters
        exp_alerts: []
      - eval_time: 3m
        alertname: DurableTimerDeadLetters
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: A timer moved to dead letters

  - interval: 1m
    input_series:
      - series: 'timer_service_cleanup_items_total{kind="moved_overdue_timers"}'
        values: '0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: DurableTimerDeadLetters
        exp_alerts: []
      - eval_time: 3m
        alertname: DurableTimerDeadLetters
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: A timer moved to dead letters
