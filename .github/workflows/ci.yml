name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build and test
        run: npm test

      - name: Start integration database
        run: npm run e2e:up

      - name: Test PostgreSQL admission and HTTP security
        run: npm run test:e2e

      - name: Stop integration database
        if: always()
        run: npm run e2e:down
