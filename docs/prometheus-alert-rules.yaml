groups:
  - name: durable-timer-service
    rules:
      - alert: DurableTimerDueBacklogHigh
        expr: sum(max by (lane) (timer_service_due_backlog_by_lane_timers)) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 1000 timers are eligible for delivery
      - alert: DurableTimerOldestDueHigh
        expr: max(max by (lane) (timer_service_oldest_due_by_lane_seconds)) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: The oldest claimable timer is over 30 seconds late
      - alert: DurableTimerBacklogSampleFailed
        expr: min(timer_service_backlog_sample_success) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A timer replica cannot read backlog from PostgreSQL
      - alert: DurableTimerBacklogSampleStale
        expr: time() - min(timer_service_backlog_sample_timestamp_seconds) > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A timer replica has not refreshed its backlog sample
      - alert: DurableTimerDeadLetters
        expr: >-
          ((max(max_over_time(timer_service_last_dead_letter_timestamp_seconds[5m])) > 0)
          and (time() - max(max_over_time(timer_service_last_dead_letter_timestamp_seconds[5m])) < 300))
          or
          (sum(increase(timer_service_deliveries_total{result="dead_letter"}[5m])) > 0)
          or
          (sum(increase(timer_service_cleanup_items_total{kind="moved_overdue_timers"}[5m])) > 0)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A timer moved to dead letters
      - alert: DurableTimerUnexpectedDeliveryTaskFailure
        expr: sum(increase(timer_service_delivery_task_failures_total[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A timer delivery task failed unexpectedly
